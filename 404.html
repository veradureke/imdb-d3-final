<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page not found · IMDB Top 1000 Project</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4eef9; --panel:#ffffff; --text:#2a1f44; --muted:#6b5b8e; --accent:#f5c518; --accent-2:#7c3aed; }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px;
  }
  .wrap { max-width:560px; }
  .badge { display:inline-block; background:var(--accent); color:#000; padding:4px 12px; border-radius:4px; font-weight:900; font-size:18px; margin-bottom:24px; }
  h1 { font-size:96px; margin:0; letter-spacing:-2px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-size:24px; margin:8px 0 16px; color:var(--text); font-weight:700; }
  p { color:var(--muted); margin:0 0 28px; line-height:1.6; }
  .btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn {
    display:inline-block; padding:11px 22px; border-radius:6px;
    text-decoration:none; font-weight:600; font-size:14px;
    transition:all 0.15s;
  }
  a.btn.primary { background:var(--accent); color:#000; }
  a.btn.primary:hover { background:#fff; }
  a.btn.ghost { background:transparent; color:var(--accent-2); border:1px solid var(--accent-2); }
  a.btn.ghost:hover { background:rgba(88,166,255,0.12); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">IMDb</span>
    <h1>404</h1>
    <h2>That page rolled the credits early.</h2>
    <p>The link you followed doesn't exist in this project. Maybe head back to the visualization or the documentation.</p>
    <div class="btn-row">
      <a class="btn primary" href="index.html">Open the dashboard</a>
      <a class="btn ghost" href="about.html">Read the documentation</a>
    </div>
  </div>
</body>
</html>
