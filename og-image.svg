<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#1f262f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- IMDb badge -->
  <rect x="80" y="80" width="120" height="56" rx="8" fill="#f5c518"/>
  <text x="140" y="120" text-anchor="middle" font-weight="900" font-size="32" fill="#000">IMDb</text>

  <!-- Title -->
  <text x="80" y="220" font-size="64" font-weight="700" fill="#e6edf3">Top 1000 Films</text>
  <text x="80" y="290" font-size="44" font-weight="400" fill="#8b949e">Interactive D3 Dashboard</text>

  <!-- Decorative chart elements -->
  <g transform="translate(80, 360)">
    <!-- mini scatter dots -->
    <circle cx="20"  cy="160" r="6"  fill="#4e79a7" opacity="0.85"/>
    <circle cx="80"  cy="135" r="9"  fill="#f28e2b" opacity="0.85"/>
    <circle cx="140" cy="120" r="7"  fill="#76b7b2" opacity="0.85"/>
    <circle cx="200" cy="100" r="11" fill="#e15759" opacity="0.85"/>
    <circle cx="260" cy="85"  r="8"  fill="#59a14f" opacity="0.85"/>
    <circle cx="320" cy="70"  r="13" fill="#edc948" opacity="0.85"/>
    <circle cx="380" cy="55"  r="9"  fill="#b07aa1" opacity="0.85"/>
    <circle cx="440" cy="50"  r="7"  fill="#4e79a7" opacity="0.85"/>
    <circle cx="500" cy="45"  r="10" fill="#76b7b2" opacity="0.85"/>

    <!-- yellow trend line -->
    <path d="M 20,160 Q 260,80 500,40" stroke="#f5c518" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- baseline -->
    <line x1="0" y1="180" x2="540" y2="180" stroke="#30363d" stroke-width="2"/>

    <!-- right-side mini bars -->
    <g transform="translate(720, 0)">
      <rect x="0"   y="140" width="36" height="40"  fill="#58a6ff" opacity="0.7"/>
      <rect x="48"  y="120" width="36" height="60"  fill="#58a6ff" opacity="0.7"/>
      <rect x="96"  y="90"  width="36" height="90"  fill="#58a6ff" opacity="0.7"/>
      <rect x="144" y="60"  width="36" height="120" fill="#58a6ff" opacity="0.7"/>
      <rect x="192" y="40"  width="36" height="140" fill="#58a6ff" opacity="0.7"/>
      <rect x="240" y="50"  width="36" height="130" fill="#58a6ff" opacity="0.7"/>
      <rect x="288" y="80"  width="36" height="100" fill="#58a6ff" opacity="0.7"/>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="608" width="1200" height="22" fill="url(#accent)"/>

  <!-- Footer text -->
  <text x="80" y="595" font-size="22" fill="#8b949e">D3.js · 1920–2020 · Vera Dureke</text>
</svg>
